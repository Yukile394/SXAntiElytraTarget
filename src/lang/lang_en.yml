# English (en). MiniMessage format: https://docs.papermc.io/adventure/minimessage/format
prefix: <gradient:#E82E3D:#F8575E><bold>glAET</bold></gradient> <dark_gray>»
general:
  reload-success: "{prefix} <#80FF00>Plugin reloaded!"
  reload-failed: "{prefix} <#FF3333>Reload failed. Check the console for details."
  no-permission: "{prefix} <#FF3333>You don't have permission to use this command!"
  players-only: "{prefix} <#FF3333>This command can only be used by players!"
  unknown-command: "{prefix} <#FF3333>Unknown command. Use /%cmd% %help% for available commands."
  wrong-args: "{prefix} <#FF3333>Incorrect argument. Usage: <#FF3333>%usage%"
alerts:
  enabled: "{prefix} <#E8E8E8>Alerts <#80FF00>enabled."
  disabled: "{prefix} <#E8E8E8>Alerts <#FF3333>disabled."
  auto-enabled: "{prefix} <#E8E8E8>Alerts have been <#80FF00>auto-enabled<gray>."
  message: "{prefix} <click:run_command:/tp %player%><#FF3333>%player% <#E8E8E8>flagged for <dark_gray>[<#FF3333>%check_name%<dark_gray>] <#FF3333>%vl%x <dark_gray>[<#FF3333>%ms%ms<dark_gray>]</click>"
  ban-message: "{prefix} <#FF3333>%player% <#E8E8E8>banned for using ElytraTarget <dark_gray>[<#FF3333>%check_name%<dark_gray>] <#FF3333>%vl%x <dark_gray>[<#FF3333>%ms%ms<dark_gray>]"
  hover:
    - " <#6A6A6A>● <#FF3333><bold>%player%</bold>"
    - ""
    - " <#6A6A6A>▪ <gray>World: <#FF3333>%world%"
    - " <#6A6A6A>▪ <gray>Location: <#FF3333>%x%, %y%, %z%"
    - ""
    - " <#6A6A6A>▪ <gray>Check: <#FF3333>%check_name%"
    - " <#6A6A6A>▪ <gray>Violations: <#FF3333>%vl%<#FF3333>x"
    - " <#6A6A6A>▪ <gray>Ping: <#FF3333>%ms%<#FF3333>ms"
    - " <#6A6A6A>▪ <gray>TPS: <#FF3333>%tps%"
    - ""
    - " <#6A6A6A>▪ <gradient:#FF3333:#FF6666>Click to teleport to the player.</gradient>"
offhand:
  warning: "{prefix} <#FF3333>You cannot use rockets while they are in your off-hand!"
update:
  message:
    - ""
    - "{prefix} <#80FF00>A new update is available!"
    - ""
    - "  <gray>Current: <#FF3333>%current%"
    - "  <gray>Latest: <#67CD00>%latest%"
    - ""
    - "  <gray>Download: <aqua><underlined>https://builtbybit.com/resources/75799</underlined>"
    - ""
menu:
  profile-title: <black>%player%'ѕ ᴘʀᴏꜰɪʟᴇ
  violations-title: <black>%player%'ѕ ᴠɪᴏʟᴀᴛɪᴏɴѕ (ᴘᴀɢᴇ %page%/%maxpage%)
  confirm-title: <black>ᴄᴏɴꜰɪʀᴍ
  confirm-clear-vl: Reset every violation for %player%?
  confirm-data-reset: Reset %type% for %target%?
  teleport-offline: "{prefix} <#FF3333>%player% is offline, cannot teleport."
  teleported: "{prefix} <#80FF00>Teleported to <#67CD00>%player%<#80FF00>."
  violations-cleared: "{prefix} <#80FF00>Cleared all violations for <#67CD00>%player%<#80FF00>."
  status-online: <#80FF00>Online
  status-offline: <#FF3333>Offline
  "yes": <#80FF00>Yes
  "no": <#FF3333>No
data-reset:
  profile-no-data: "{prefix} <#FF3333>No violation data found for <#BA2525>%player%<#FF3333>."
  no-data: "{prefix} <#FF3333>No data found for <#BA2525>%player%<#FF3333>."
  target-all: "%all%"
  success-all: "{prefix} <#80FF00>Reset <#67CD00>%type%<#80FF00> for all players."
  success-player: "{prefix} <#80FF00>Reset <#67CD00>%type%<#80FF00> for <#67CD00>%player%<#80FF00>."
  console-confirm: "{prefix} <#FFCC33>Confirm by running: <#FF3333>/%cmd% %data% %reset% %type% %target% %confirm%"
commands:
  usage:
    profile: /%cmd% %profile% <player>
    data-reset: /%cmd% %data% %reset% <%violations_type%|%total_violations_type%> <%all%|player>
    alerts: /%cmd% %alerts%
    reload: /%cmd% %reload%
    help: /%cmd% %help%
  main:
    usage:
      - <dark_gray><strikethrough>-----------------------------------------------------</strikethrough>
      - ""
      - "  <gradient:#FF3333:#FF5555><bold>glAntiElytraTarget</bold></gradient> Commands"
      - ""
      - "  <#FF3333>/%cmd% %alerts% <dark_gray>- <gray>Toggle alerts"
      - "  <#FF3333>/%cmd% %reload% <dark_gray>- <gray>Reload configuration"
      - "  <#FF3333>/%cmd% %profile% <player> <dark_gray>- <gray>View a player's profile"
      - "  <#FF3333>/%cmd% %data% %reset% <dark_gray>- <gray>Reset stored violation data"
      - "  <#FF3333>/%cmd% %help% <dark_gray>- <gray>Show this help message"
      - ""
      - <dark_gray><strikethrough>-----------------------------------------------------</strikethrough>
language-version: 2.0.0
