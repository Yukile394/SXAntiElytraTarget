# Shared confirm menu for reset actions. Title from lang file (menu-confirm-title)
# Placeholders: %action%
# Actions: [aet_confirm] [aet_cancel] [sound]
rows: 3
open-actions:
  - "[sound] BLOCK_ENDER_CHEST_OPEN 0.5 1.4"
close-actions:
  - "[sound] BLOCK_ENDER_CHEST_CLOSE 0.5 1.2"
confirm:
  material: LIME_STAINED_GLASS_PANE
  name: <#80FF00>ᴄᴏɴꜰɪʀᴍ
  lore:
    - ""
    - <gray>%action%
    - ""
    - <#6A6A6A>» <#80FF00><u>Click</u> to confirm!
  slots:
    - 0
    - 1
    - 2
    - 9
    - 10
    - 11
    - 18
    - 19
    - 20
  actions:
    all-click:
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP 0.5 1.5"
      - "[aet_confirm]"
cancel:
  material: RED_STAINED_GLASS_PANE
  name: <#FF3333>ᴄᴀɴᴄᴇʟ
  lore:
    - ""
    - <gray>Go back without changes.
    - ""
    - <#6A6A6A>» <#FF3333><u>Click</u> to cancel!
  slots:
    - 6
    - 7
    - 8
    - 15
    - 16
    - 17
    - 24
    - 25
    - 26
  actions:
    all-click:
      - "[sound] UI_BUTTON_CLICK 0.6 1.0"
      - "[aet_cancel]"
filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  hide-tooltip: true
  slots:
    - 3
    - 4
    - 5
    - 12
    - 13
    - 14
    - 21
    - 22
    - 23

# Do not change this
menu-version: 2.0.0
