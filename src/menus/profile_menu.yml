# /aet profile menu. Title from lang file (menu-profile-title)
# Actions: [aet_tp] [aet_violations] [aet_clearvl] [close] [refresh] [sound]
# Placeholders: %player% %total_violations% %violation_count% %status% %online% %world% %x% %y% %z% %ping% %bps% %gamemode%
rows: 3
# Sounds/actions when the menu opens
open-actions:
  - "[sound] BLOCK_ENDER_CHEST_OPEN 0.5 1.4"
# Sounds/actions when the menu closes
close-actions:
  - "[sound] BLOCK_ENDER_CHEST_CLOSE 0.5 1.2"
# Background glass panes
filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  hide-tooltip: true
  slots:
    - 0
    - 1
    - 2
    - 3
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 14
    - 16
    - 17
    - 18
    - 19
    - 20
    - 21
    - 23
    - 24
    - 25
    - 26
player-info:
  slot: 4
  material: PLAYER_HEAD
  skull: "%player%"
  name: <#FF3333>%player%
  item-flags:
    - HIDE_ADDITIONAL_TOOLTIP
  # Shown while the player is online
  online-lore:
    - ""
    - " <#6A6A6A>▪ <gray>Status: %status%"
    - " <#6A6A6A>▪ <gray>Total violations: <#FF3333>%total_violations%"
    - " <#6A6A6A>▪ <gray>Logged violations: <#FF3333>%violation_count%"
    - ""
    - " <#6A6A6A>▪ <gray>World: <#F66868>%world%"
    - " <#6A6A6A>▪ <gray>Location: <#F66868>%x%<dark_gray>, <#F66868>%y%<dark_gray>, <#F66868>%z%"
    - " <#6A6A6A>▪ <gray>Gamemode: <#F66868>%gamemode%"
    - ""
    - " <#6A6A6A>▪ <gray>Ping: <#F66868>%ping%ms"
    - " <#6A6A6A>▪ <gray>BPS: <#F66868>%bps%"
    - ""
    - <#6A6A6A>» <#FEE723><u>Click</u> to refresh!
  # Shown while the player is offline
  offline-lore:
    - ""
    - " <#6A6A6A>▪ <gray>Status: %status%"
    - " <#6A6A6A>▪ <gray>Total violations: <#FF3333>%total_violations%"
    - " <#6A6A6A>▪ <gray>Logged violations: <#FF3333>%violation_count%"
    - ""
    - <#6A6A6A>» <#FEE723><u>Click</u> to refresh!
  actions:
    all-click:
      - "[sound] UI_BUTTON_CLICK 0.6 1.3"
      - "[refresh]"
items:
  teleport:
    slot: 11
    material: ENDER_PEARL
    name: <#91FFDB>ᴛᴇʟᴇᴘᴏʀᴛ
    lore:
      - <gray>Teleport to <#91FFDB>%player%<gray>.
      - ""
      - <#6A6A6A>» <#FEE723><u>Click</u> to teleport!
    actions:
      all-click:
        - "[sound] ENTITY_ENDERMAN_TELEPORT 1.0 1.0"
        - "[aet_tp]"
  violations:
    slot: 13
    material: WRITABLE_BOOK
    name: <#FFB454>ᴠɪᴏʟᴀᴛɪᴏɴѕ
    lore:
      - <gray>Browse every <#FFB454>%player%'s <gray>violation logs
      - ""
      - " <#6A6A6A>▪ <gray>Logged violations: <#FFB454>%violation_count%"
      - ""
      - <#6A6A6A>» <#FEE723><u>Click</u> to view!
    actions:
      all-click:
        - "[sound] UI_BUTTON_CLICK 0.6 1.3"
        - "[aet_violations]"
  clear-vl:
    slot: 15
    material: REDSTONE
    name: <#E04720>ʀᴇѕᴇᴛ ᴠɪᴏʟᴀᴛɪᴏɴѕ
    lore:
      - <gray>Clear all violations for <#FF3333>%player%<gray>.
      - ""
      - <#6A6A6A>» <#FEE723><u>Click</u> to reset!
    actions:
      all-click:
        - "[sound] UI_BUTTON_CLICK 0.6 1.3"
        - "[aet_clearvl]"
  close:
    slot: 22
    material: BARRIER
    name: <#FF3333>ᴄʟᴏѕᴇ
    lore:
      - ""
      - <#6A6A6A>» <#FEE723><u>Click</u> to close!
    actions:
      all-click:
        - "[sound] BLOCK_ENDER_CHEST_CLOSE 0.5 1.2"
        - "[close]"

# Do not change this
menu-version: 2.0.0
